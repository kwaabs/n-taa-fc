name: field_collector
description: "Field Collector — offline-first data collection"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Database (offline-first core)
  drift: ^2.28.2
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI helpers
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

  app_links: ^6.3.2

  # Native Microsoft / Google OAuth (AppAuth → id_token → GoTrue)
  flutter_appauth: ^12.0.2

  # Utilities
  archive: ^4.0.4

  geolocator: ^13.0.2
  image_picker: ^1.1.2

  maplibre_gl: ^0.26.1

  uuid: ^4.0.0

  # A6: External GNSS Bluetooth support
  # flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1

  flutter_svg: ^2.0.10+1

  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation (IMPORTANT: all build v3 compatible)
  build_runner: ^2.4.13
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  drift_dev: ^2.28.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F6B6B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"