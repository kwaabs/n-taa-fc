# Overlay: run fc-api replicas behind Caddy (JWT — no sticky sessions).
# Usage:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.fc-api.yml \
#     --env-file .env up -d --build --scale fc-api=2
#
# Publishes LB on host :5355 (same port as local `make fc-api`).
# Stop local `make fc-api` before bringing this overlay up.

services:
  fc-api:
    build:
      context: ..
      dockerfile: docker/fc-api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5355"
      ENV: ${ENV:-production}
      DATABASE_URL: postgres://supabase_admin:ntaafc@postgres:5432/ntaafc?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5356,http://localhost:3000}
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:5352}
      S3_BUCKET: ${S3_BUCKET:-field-collector}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_USE_SSL: "false"
      VALKEY_URL: redis://valkey:6379
      GOTRUE_URL: http://gotrue:8081
      TIPPECANOE_URL: http://tippecanoe:8080
      AUTH_PROFILE_UPSERT_TTL: ${AUTH_PROFILE_UPSERT_TTL:-5m}
    expose:
      - "5355"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      rustfs:
        condition: service_started
      tippecanoe:
        condition: service_started
      gotrue:
        condition: service_started

  fc-api-lb:
    image: caddy:2.9-alpine
    container_name: ntaafc-fc-api-lb
    restart: unless-stopped
    ports:
      - "5355:5355"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - fc-api
